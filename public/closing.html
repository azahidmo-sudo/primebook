<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://htrlqotaetdwccervhmd.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Daily Closing · PrimeBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>

/* Layout: a back-office ledger desk. Sticky control strip (date, branch, staff, status) + workflow rail,
   then one working view at a time. Figures in mono, headings in a quiet serif. */
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --ink:#152033; --ink-2:#4A5568; --ink-3:#7A8699; --line:#DDE3EC; --line-2:#EEF1F5;
  --accent:#1F4FD1; --accent-soft:#E8EEFC; --accent-ink:#173C9E;
  --ok:#17784A; --ok-soft:#E3F3EA; --warn:#9A5B07; --warn-soft:#FCF0DC; --bad:#B42318; --bad-soft:#FDE8E6; --info:#1F4FD1; --info-soft:#E8EEFC;
  --band:#0F1B2E; --band-ink:#E7ECF5; --band-2:#1A2942;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1420; --panel:#141E2E; --ink:#E6ECF5; --ink-2:#B3BFD1; --ink-3:#8593A8; --line:#26344A; --line-2:#1C2839;
  --accent:#7EA2FF; --accent-soft:#1B2A4C; --accent-ink:#A9C0FF;
  --ok:#5CCB8F; --ok-soft:#14301F; --warn:#F0B35A; --warn-soft:#352711; --bad:#FF8A7E; --bad-soft:#3A1815; --info:#7EA2FF; --info-soft:#1B2A4C;
  --band:#09101B; --band-ink:#E7ECF5; --band-2:#16233A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1420; --panel:#141E2E; --ink:#E6ECF5; --ink-2:#B3BFD1; --ink-3:#8593A8; --line:#26344A; --line-2:#1C2839;
  --accent:#7EA2FF; --accent-soft:#1B2A4C; --accent-ink:#A9C0FF;
  --ok:#5CCB8F; --ok-soft:#14301F; --warn:#F0B35A; --warn-soft:#352711; --bad:#FF8A7E; --bad-soft:#3A1815; --info:#7EA2FF; --info-soft:#1B2A4C;
  --band:#09101B; --band-ink:#E7ECF5; --band-2:#16233A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.mono,.n,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* control strip */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--band-2)}
.band .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand b{font:600 17px var(--f-display);letter-spacing:.01em}
.brand small{font:500 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#9FB0CC}
.ctl{display:flex;flex-direction:column;gap:3px;min-width:0}
.ctl label{font:500 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#9FB0CC}
.ctl select,.ctl input{background:var(--band-2);color:var(--band-ink);border:1px solid #2C3D5C;border-radius:6px;font:500 13px var(--f-body);padding:6px 8px;min-height:34px;max-width:100%}
.ctl select:focus-visible,.ctl input:focus-visible{outline:2px solid #7EA2FF;outline-offset:1px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:600 12px var(--f-body);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--line-2);color:var(--ink-2)}
.band .pill{font-size:12.5px;padding:5px 12px}
/* workflow rail */
.rail{background:var(--panel);border-bottom:1px solid var(--line)}
.rail ol{list-style:none;margin:0;padding:12px 0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;counter-reset:s}
.rail li{counter-increment:s;display:flex;flex-direction:column;gap:6px;min-width:0}
.rail li .bar{height:4px;border-radius:2px;background:var(--line)}
.rail li.done .bar{background:var(--ok)} .rail li.cur .bar{background:var(--accent)}
.rail li span{font:500 12px/1.3 var(--f-body);color:var(--ink-3)}
.rail li span::before{content:counter(s) ". ";font-family:var(--f-mono)}
.rail li.done span{color:var(--ink-2)} .rail li.cur span{color:var(--accent-ink);font-weight:600}
/* nav */
.nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
.nav a{padding:11px 14px;color:var(--ink-2);text-decoration:none;font:500 14px var(--f-body);border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)} .nav a[aria-current="page"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:20px 48px}
.view{display:flex;flex-direction:column;gap:18px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px}
.sec-h p{color:var(--ink-3);font-size:13px}
.lede{color:var(--ink-2);max-width:72ch}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--panel);min-width:0}
.kpi small{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{font:500 21px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12.5px;color:var(--ink-3)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--line-2);color:var(--ink-2);font:600 11.5px var(--f-body);letter-spacing:.03em;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;background:var(--line-2);border-top:1px solid var(--line)}
tr.sub td{background:var(--bg);font-weight:600;color:var(--ink-2)}
.mu{color:var(--ink-3)} .pos{color:var(--ok)} .neg{color:var(--bad)} .wn{color:var(--warn)}
.ref{font:500 12.5px var(--f-mono);white-space:nowrap}
.tag{display:inline-block;font:600 11px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--line-2);color:var(--ink-2)}
.dr{color:var(--ink)} .cr{color:var(--ink-2)}
/* checks */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line-2)}
.checks li:last-child{border-bottom:0}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-mono)}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.bad{background:var(--bad-soft);color:var(--bad)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.info{background:var(--info-soft);color:var(--info)}
/* buttons and forms */
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 13.5px var(--f-body);border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:36px}
button:hover{border-color:var(--ink-3)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) button.pri{color:var(--panel)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) button.pri{color:#fff}}
:root[data-theme="light"] button.pri{color:#fff}
button.ghost{background:transparent}
button.dg{color:var(--bad);border-color:var(--bad-soft)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:400 13.5px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px;max-width:100%}
input.qty{width:76px;text-align:right;font-family:var(--f-mono)}
textarea{width:100%;min-height:58px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font:600 12px var(--f-body);color:var(--ink-2)}
.note{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--info-soft);color:var(--accent-ink)} .note.warn{background:var(--warn-soft);color:var(--warn)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.note b{font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0;color:var(--ink)}
.callout h3{font-size:16px;margin-bottom:4px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:13px}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.log li:last-child{border-bottom:0}
.log time{font:500 12px var(--f-mono);color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(10,20,40,.25)}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
:root:not([data-theme="light"]) .toast{color:var(--panel)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .toast{color:#fff}}
:root[data-theme="light"] .toast{color:#fff}
.rep-nav{display:flex;flex-wrap:wrap;gap:6px}
.rep-nav button{font-weight:500;font-size:12.5px;padding:5px 10px;min-height:30px}
.je{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.je-h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:9px 12px;background:var(--line-2);border-bottom:1px solid var(--line)}
.je-h .d{color:var(--ink-2);font-size:13px;flex:1 1 280px;min-width:0}
.je table{font-size:12.5px} .je td,.je th{padding:6px 12px}
.je .bal{padding:6px 12px;font-size:12px;border-top:1px solid var(--line-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.matrix td{text-align:center} .matrix td:first-child{text-align:left}
.y{color:var(--ok);font-weight:700} .x{color:var(--ink-3)}
pre.mermaid{background:var(--panel);margin:0;overflow-x:auto}
.formula{font:500 12.5px/1.7 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.sample{font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:4px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.rail ol{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.rail ol{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:17px}.sec{padding:14px}.brand{flex-basis:100%}.band .wrap{gap:10px 12px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ---- shared with the sample app ---- */
[hidden]{display:none!important}
.nav button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:11px 14px;color:var(--ink-2);font:500 14px var(--f-body);white-space:nowrap;min-height:0}
.nav button:hover{color:var(--ink);border-color:transparent}
.nav button[aria-current="page"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fgrid .field input,.fgrid .field select{width:100%}
.field select,.field input{width:100%}
.mini{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.mini input{flex:1 1 110px;min-width:0}
.note button{margin-left:6px;min-height:30px;padding:4px 10px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.band{position:static}}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ft{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;font-weight:400}
.ft:hover{border-color:var(--accent);background:var(--accent-soft)}
.ft b{font:600 14px var(--f-body);color:var(--ink)}.ft span{font-size:12.5px;color:var(--ink-2);line-height:1.45}.ft em{font-style:normal;font:600 12px var(--f-body);color:var(--accent-ink);margin-top:2px}
.sec{scroll-margin-top:170px}
@media (max-width:560px){.sec{scroll-margin-top:12px}}

/* ---- web platform: band additions ---- */
.w-v{color:var(--band-ink);font:500 14px var(--f-body);display:inline-flex;align-items:center;gap:6px;min-height:34px}
.w-r{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#9FB0CC;border:1px solid var(--band-2);border-radius:999px;padding:1px 8px}
.w-acts{flex-direction:row!important;gap:6px;align-items:flex-end;margin-left:auto}
.w-btn{background:transparent;color:var(--band-ink);border:1px solid #33476A;min-height:32px;padding:4px 12px;font:500 13px var(--f-body);border-radius:8px}
.w-btn:hover{background:var(--band-2);border-color:#4A6290;color:#fff}

/* ---- web platform: sign-in and setup screens ---- */
#gate{min-height:100vh;background:radial-gradient(900px 420px at 85% -10%,#DCE6FA,transparent 60%),var(--bg)}
.g-wrap{max-width:760px;margin:0 auto;padding:48px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.g-brand{text-align:center}.g-brand b{display:block;font:600 22px var(--f-display);color:var(--ink)}.g-brand small{font:500 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.g-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(21,32,51,.07);display:flex;flex-direction:column;gap:12px}
.g-card.g-wide{max-width:760px}
.g-card h1{font-size:22px}.g-card p{margin:0}
.g-card .field{display:flex;flex-direction:column;gap:4px}
.g-card .btns{margin-top:4px}.g-card .btns .pri{min-width:140px}
.g-links{font-size:13px;color:var(--ink-3)}
.lnk{background:none;border:0;padding:0;min-height:0;color:var(--accent-ink);font:500 13px var(--f-body);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.g-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.g-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.g-book{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;font-weight:400}
.g-book:hover{border-color:var(--accent);background:var(--accent-soft)}
.g-book b{font:600 16px var(--f-body);color:var(--ink)}.g-book span{font-size:12.5px;color:var(--ink-2)}.g-book em{font-style:normal;font:600 12px var(--f-body);color:var(--accent-ink)}
.g-new{border-top:1px solid var(--line-2);padding-top:12px}
.g-new summary{cursor:pointer;font:600 14px var(--f-body);color:var(--accent-ink);margin-bottom:10px}
.g-foot{font-size:12px;color:var(--ink-3);text-align:center}.g-foot a{color:var(--ink-2)}
@media (max-width:560px){.g-wrap{padding-top:24px}.g-card{padding:18px}.w-acts{margin-left:0}}
.g-alt{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line-2);padding-top:12px;margin-top:2px}
.g-alt button{width:100%}.g-alt .mu{font-size:12.5px}
#c-staff{background:var(--band-2);color:var(--band-ink);border:1px solid #33476A;border-radius:8px;min-height:34px;padding:4px 8px;font:500 14px var(--f-body);max-width:230px}

</style>
</head>
<body>
<div id="gate"></div>
<div id="shell" hidden>
<div class="band"><div class="wrap">
  <div class="brand"><b>BRIMAPAY · Daily Closing</b><small>PrimeBook · base currency CAD</small></div>
  <div class="ctl"><label for="c-date">Business date</label><select id="c-date"></select></div>
  <div class="ctl"><label>Branch</label><span id="c-book" class="w-v"></span></div>
  <div class="ctl"><label>Signed in</label><span id="c-who" class="w-v"></span></div>
  <div class="ctl"><label>Day status</label><span id="c-status"></span></div>
  <div class="ctl"><label>Books</label><span id="c-sync"></span></div>
  <div class="ctl w-acts"><button type="button" class="w-btn" data-gs="books">Switch book</button><button type="button" class="w-btn" data-gs="signout">Sign out</button></div>
</div></div>
<div class="rail"><div class="wrap"><ol id="rail" aria-label="Closing workflow"></ol></div></div>
<nav class="nav" aria-label="Sections"><div class="wrap" id="nav" style="display:flex;gap:2px;overflow-x:auto"></div></nav>
<main class="wrap"><div id="app"></div></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* =====================================================================
   BRIMAPAY Daily Closing – ledger engine (pure, no DOM).
   A book holds many business days for one branch. Every action goes
   through act(user, action, payload) which checks role, separation of
   duties and day state, then posts balanced journals and logs an
   append-only, hash-chained audit entry.
   ===================================================================== */
const r2=v=>Math.round(((+v||0)+Number.EPSILON)*100)/100;
const r6=v=>+(+v||0).toFixed(8);
const BASE='CAD';let BRANCH='Vancouver',BCODE='VAN';
const USERS={
  farhan:{name:'Farhan',role:'Teller',title:'Teller · Preparer'},
  amina:{name:'Amina',role:'Manager',title:'Branch Manager · Approver'},
  daniel:{name:'Daniel',role:'Finance',title:'Finance · Head-office accountant'},
  sara:{name:'Sara',role:'Auditor',title:'Internal auditor · Read only'}};
const ACC=[
 ['1000','Cash on Hand – Till','CAD','A','Cash'],
 ['1005','Safe – CAD','CAD','A','Cash'],
 ['1010','Bank – RBC Operating','CAD','A','Bank'],
 ['1100','FX Stock – USD','USD','A','FX stock'],
 ['1101','FX Stock – AED','AED','A','FX stock'],
 ['1102','FX Stock – ETB','ETB','A','FX stock'],
 ['1103','FX Stock – KES','KES','A','FX stock'],
 ['1210','Due from Taaj System','CAD','A','Settlement asset'],
 ['3000',"Owner's Capital",'CAD','E','Equity'],
 ['3900','Retained Earnings (P&L summary)','CAD','E','Equity'],

 ['journal_line','entry_ref, line_no, account, currency, fc_amount, rate, rate_id, debit_cad, credit_cad','Sum of debits = sum of credits per entry, in CAD.'],
 ['fx_rate','id, date, currency, type (buy / sell / mid / closing), rate, source, published_at, approved_by','Every rate used is stored with its source.'],
 ['fx_cost_pool','branch, currency, qty, cad_cost, avg_rate (after each movement)','Weighted average cost for realized gain on sale.'],
 ['cash_count','day_id, account, currency, denomination, quantity, counted_by, witness','Till, safe and foreign-note counts.'],
 ['reconciliation','day_id, account, type, expected, actual, variance, variance_cad, reason, support_ref, status, prepared_by, reviewed_by','One per account to reconcile.'],
 ['recon_item','reconciliation_id, ref, description, amount, age_days, cleared_ref','Outstanding cheques, deposits in transit, unmatched agent lines.'],
 ['adjustment','ref (ADJ-…), day_id, reason, journal_ref, requested_by, approved_by, status','The only way to change balances outside a transaction.'],
 ['agent_statement','agent (Taaj), date, line_ref, amount, matched_journal_ref','Imported settlement statements.'],
 ['exception','day_id, type, severity, owner, due, status, resolution','Anything needing a human decision.'],
 ['audit_log','seq, at, user, role, branch, action, entity, before, after, result, device, prev_hash, hash','Append-only, hash-chained.']];
 const perms=[['Open day / load opening','✓','✓','—','—'],['Record transactions','✓','✓','—','—'],['Enter cash and stock counts','✓','✓ (witness)','—','—'],['Explain variances','✓','✓','—','—'],['Raise adjustment','✓','✓','—','—'],['Approve adjustment (not own)','—','✓','✓','—'],['Submit day','✓','✓','—','—'],['Approve day (not own)','—','✓','—','—'],['Return day with reason','—','✓','✓','—'],['Lock day / next-day opening','—','✓','✓','—'],['Reverse posted transaction','—','✓','✓','—'],['Reopen locked day (reason + 2nd approver)','—','—','✓','—'],['Publish and approve closing rates','—','—','✓ (Treasury)','—'],['Edit opening balances','—','—','—','—'],['View reports and audit trail','Own branch','Own branch','All','All']];
 return`<section class="sec"><div class="sec-h"><div><span class="eyebrow">Architecture</span><h2>How the system fits together</h2></div></div>
 <p class="lede">One ledger, many branches. Tellers record business events; the system turns each into a balanced journal. The closing workflow sits on top of the ledger and decides when a branch day can be approved and locked. Reports read the same ledger, so they always agree.</p>
 <div class="grid3"><div class="stack"><h3>Capture</h3><p class="mu">Teller screens for buy, sell, remittance payout, settlement, expense and transfer. Each picks accounts from the chart of accounts and a rate from the rate board.</p></div>
 <div class="stack"><h3>Ledger</h3><p class="mu">Posting service validates, balances and writes journals in CAD with the original currency, amount and rate on every line. Posted entries are append-only.</p></div>
 <div class="stack"><h3>Close</h3><p class="mu">Business-day service: opening carry-forward, counts, reconciliations, blockers, approvals, lock, P&amp;L close and next-day opening.</p></div></div></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Workflow</span><h2>Business-day states</h2></div><p>Each transition is permission-checked and logged</p></div>
 <pre class="mermaid">stateDiagram-v2
  [*] --> NotOpened
  NotOpened --> Open: Open day (Teller) - opening loaded from prior locked close
  Open --> Open: Record transactions, count, reconcile, explain variances
  Open --> Submitted: Submit (zero blockers)
  Submitted --> Returned: Return with reason (Manager)
  Returned --> Submitted: Correct and resubmit
  Submitted --> Approved: Approve (Manager, not the preparer)
  Approved --> Locked: Lock day - CL entry closes P&amp;L
  Locked --> NextDayOpen: Generate next-day opening (carries balance-sheet balances, rates proposed for approval)
  Locked --> Reopened: Reopen (Finance, reason, second approver)
  Reopened --> Submitted</pre></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Data model</span><h2>Core tables</h2></div></div><div class="tw"><table><thead><tr><th>Table</th><th>Key fields</th><th>Purpose</th></tr></thead><tbody>${ent.map(e=>`<tr><td class="ref">${e[0]}</td><td style="min-width:320px">${A(e[1])}</td><td>${A(e[2])}</td></tr>`).join('')}</tbody></table></div></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Chart of accounts used in the sample</span><h2>Accounts</h2></div></div><div class="tw"><table><thead><tr><th>Code</th><th>Name</th><th>Class</th><th>Currency</th><th>At close</th></tr></thead><tbody>${ACC.map(a=>`<tr><td class="ref">${a.code}</td><td>${A(a.name)}${a.code=='1210'?' <span class="tag">asset, not income</span>':''}</td><td>${A(a.grp)}</td><td>${a.ccy}</td><td>${a.bs?'Carry forward':'Close to 3900'}</td></tr>`).join('')}</tbody></table></div>
 <div class="callout"><h3>Taaj System</h3><p>1210 Due from Taaj System is a settlement asset (a due-from-agent receivable). Paying out a Taaj remittance increases it. A cash or bank receipt from Taaj reduces it (<span class="mono">Dr 1000 or 1010 / Cr 1210</span>). Only the commission is income. Receipts from Taaj must never be posted to an income account; the posting service rejects that combination.</p></div></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Access</span><h2>Role permissions</h2></div><p>Branch scope applies to every row</p></div><div class="tw"><table class="matrix"><thead><tr><th>Permission</th><th>Teller</th><th>Branch Manager</th><th>Finance</th><th>Auditor</th></tr></thead><tbody>${perms.map(r=>`<tr>${r.map((c,i)=>`<td>${i==0?A(c):c=='—'?'<span class="x">—</span>':c.startsWith('✓')?'<span class="y">'+A(c)+'</span>':A(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Policies</span><h2>Accounting rules</h2></div></div><div class="grid2">
 <div class="stack"><h3>Opening balances</h3><p class="mu">Copied by the system from the prior day's locked close, by branch, account and currency. No input field exists. A correction is an adjustment journal with reason, maker and a different approver.</p>
 <h3>Closing</h3><p class="mu">Closing = opening + debits − credits, per account and currency. Assets, liabilities and equity carry forward. At lock, a CL entry moves every income and expense balance to 3900, so they open at zero next day. Period income statements read journals excluding CL entries.</p></div>
 <div class="stack"><h3>Foreign exchange</h3><p class="mu">Each foreign currency has its own stock account and is counted, reconciled and totalled on its own. Lines keep the foreign amount and rate; CAD is the functional currency for every total. Sales and payouts realize gain or loss against weighted average cost. Unrealized gain or loss is calculated daily at Treasury closing rates and posted at month-end, reversed on the first day of the next month.</p>
 <h3>Corrections</h3><p class="mu">Nothing posted is edited or deleted. A reversal (REV) mirrors the original. A reopened day keeps its first approval history and needs a fresh approval.</p></div></div></section>`}

 ['VR-09','Rate','Every foreign line needs a rate with a source. A rate more than 2% from the board rate needs a manager override with reason.','Reject / approve'],
 ['VR-10','Funds','Till and FX stock can never go below zero. Bank accounts follow their overdraft limit.','Reject'],
 ['VR-11','Counts','Denomination quantities are whole numbers ≥ 0; counted total = Σ denomination × quantity.','Reject'],
 ['VR-12','Variance','Any variance ≠ 0 needs a reason (10+ characters) and a supporting reference.','Blocker'],
 ['VR-13','Stock variance','A stock variance is cleared only by an approved adjustment at carrying cost.','Blocker'],
 ['VR-14','Reconciliation','Bank and agent settlement differences must be zero after listed outstanding items.','Blocker'],
 ['VR-15','Closing rates','Closing rates for every held currency approved before submit.','Blocker'],
 ['VR-16','Segregation','Maker ≠ checker for adjustments, day approval and reopening.','Reject'],
 ['VR-17','Lock','No posting, count or reason change after submit unless the day is returned; nothing after lock unless Finance reopens.','Reject'],
 ['VR-18','Compliance','Cash transactions of CAD 10,000 or more (single or 24-hour aggregate) flagged for the FINTRAC large cash report before submit.','Blocker'],
 ['VR-19','Reversal','Only Manager or Finance; reason required; original stays and is linked.','Reject']];
 const integ=[['Identity provider (SSO)','Sign-in, MFA, role and branch assignment','Real time'],['General ledger / posting API','All journals; month-end consolidation','Real time'],['Treasury rate feed','Buy, sell and closing mid rates with source and approver','Morning and 17:00 PT'],['Bank statement feed','Statement lines for bank reconciliation (CSV or BAI2)','Daily'],['Taaj agent portal','Payout confirmations and daily settlement statement','Hourly + daily statement'],['Compliance (FINTRAC)','Large cash and suspicious transaction reports; KYC references','Event driven'],['Document store','Count sheets, receipts, incident reports linked by reference','On upload'],['Notifications','Blockers, pending approvals, overdue closes to managers','Event driven'],['Reporting / export','PDF and CSV of every report; read-only API for BI','On demand']];
 return`<section class="sec"><div class="sec-h"><div><span class="eyebrow">Validation and control rules</span><h2>What the system enforces</h2></div></div><div class="tw"><table><thead><tr><th>Rule</th><th>Area</th><th>Rule</th><th>Outcome</th></tr></thead><tbody>${vr.map(r=>`<tr><td class="ref">${r[0]}</td><td>${r[1]}</td><td style="min-width:320px">${A(r[2])}</td><td>${chip(r[3]=='Blocker'?'Blocks submit':r[3])}</td></tr>`).join('')}</tbody></table></div></section>
 <div class="grid2"><section class="sec"><div class="sec-h"><div><span class="eyebrow">Dashboard</span><h2>Blockers</h2></div></div><p class="lede">Submit and Approve stay disabled while any blocker is open. The live list for ${A(BRANCH)}:</p><ul class="checks">${E.checks(D_()).map(c=>`<li><span class="ic ${c.ok?'ok':c.sev=='block'?'bad':'warn'}">${c.ok?'✓':'!'}</span><span>${A(c.text)}</span><span></span></li>`).join('')}</ul></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Exceptions</span><h2>Exception handling</h2></div></div><div class="tw"><table><thead><tr><th>Severity</th><th>Examples</th><th>Handling</th></tr></thead><tbody>
 <tr><td>${chip('High')}</td><td>Till variance, unmatched agent settlement, unbalanced posting attempt</td><td>Blocks submit. Manager notified at once. Resolve same day.</td></tr>
 <tr><td>${chip('Medium')}</td><td>FX stock variance, rate override, reversal</td><td>Needs reason + reference + approved adjustment. Visible to Finance.</td></tr>
 <tr><td>${chip('Low')}</td><td>Outstanding bank item, refused actions</td><td>Monitored; escalates after 7 days or repeated attempts.</td></tr>
 <tr><td>${chip('Info')}</td><td>Unrealized FX moves, compliance threshold checks</td><td>Reported; no action unless limits are breached.</td></tr></tbody></table></div></section></div>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Audit trail</span><h2>What is recorded</h2></div></div><p class="lede">Every action, including refused attempts, writes one append-only entry: time, user, role, branch, action, entity and reference, before and after values, result, and device. Each entry carries a hash of itself plus the previous entry, so a change to history breaks the chain. Auditors read everything and change nothing.</p></section>
 <section class="sec"><div class="sec-h"><div><span class="eyebrow">Integration points</span><h2>Connected systems</h2></div></div><div class="tw"><table><thead><tr><th>System</th><th>Exchange</th><th>Timing</th></tr></thead><tbody>${integ.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section>`}



/* ---------- UAT ---------- */
function vUat(){const p=UAT.filter(t=>t.pass===true).length,f=UAT.filter(t=>t.pass===false).length,m=UAT.filter(t=>t.manual).length;
 return`<section class="sec"><div class="sec-h"><div><span class="eyebrow">User acceptance</span><h2>UAT acceptance tests</h2></div><div class="btns"><button type="button" data-uat>Run again</button></div></div>
 <p class="lede">Automated tests replay the sample through a fresh copy of the engine on this page, including a full second business day. Manual tests are for the UAT team on the real environment.</p>
 <div class="kpis"><div class="kpi"><small>Passed</small><b class="pos">${p}</b><span>automated</span></div><div class="kpi"><small>Failed</small><b class="${f?'neg':''}">${f}</b><span>automated</span></div><div class="kpi"><small>Manual</small><b>${m}</b><span>to sign off</span></div><div class="kpi"><small>Total</small><b>${UAT.length}</b><span>test cases</span></div></div>
 <div class="tw"><table><thead><tr><th>ID</th><th>Area</th><th>Scenario</th><th>Expected result</th><th>Result</th><th>Evidence</th></tr></thead><tbody>${UAT.map(t=>`<tr><td class="ref">${t.id}</td><td>${t.area}</td><td style="min-width:240px">${A(t.scenario)}</td><td style="min-width:260px">${A(t.expected)}</td><td>${t.manual?chip('Manual'):chip(t.pass?'Pass':'Fail')}</td><td class="mu" style="min-width:200px;font-size:12px">${A(t.detail)}</td></tr>`).join('')}</tbody></table></div></section>`}

/* ---------- events ---------- */
function readCounts(){const till={};CASH_DENOMS.forEach(d=>{const v=val('q-'+String(d).replace('.','_'));till[d]=v===''?0:v});const fx={};E.held(D_()).forEach(c=>fx[c]=val('c-fx-'+c));return{till,safe:val('c-safe'),fx,witness:val('c-wit')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){VIEW=b.dataset.view;render();const tg=b.dataset.target&&document.getElementById(b.dataset.target);if(tg)tg.scrollIntoView({block:'start'});else window.scrollTo(0,0);return}
 if(b.dataset.goLatest!=null){E.B.cur=E.B.days.length-1;if(SYNC.mode=='local')persist();VIEW='dashboard';render();return}
 if(b.dataset.reset!=null){resetBook(b);return}
 if(b.dataset.start!=null){startShared();return}
 if(b.dataset.uat!=null){UAT=runUAT();render();toast({ok:true,msg:'UAT re-run: '+UAT.filter(t=>t.pass).length+' passed.'});return}
 if(b.dataset.ret!=null){const x=$('#retbox');x.hidden=!x.hidden;return}
 if(b.dataset.jump){const el=document.getElementById(b.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(b.dataset.clear!=null){FORM={...FORM,amt:'',ext:'',override:'',com:'',note:''};render();return}
 if(b.dataset.fill!=null){const D=D_();let rem=E.bal(D,'1000').cad;CASH_DENOMS.forEach(d=>{const q=Math.floor((rem+1e-9)/d);const el=document.getElementById('q-'+String(d).replace('.','_'));if(el)el.value=q;rem=r2(rem-q*d)});
  const s=$('#c-safe');if(s)s.value=E.bal(D,'1005').cad;E.held(D).forEach(c=>{const el=document.getElementById('c-fx-'+c);if(el)el.value=E.bal(D,FXA[c]).fc});const w=$('#c-wit');if(w&&!w.value)w.value='';
  const bs=$('#b-stmt');if(bs&&!bs.value)bs.value=E.bal(D,'1010').cad;const br=$('#b-ref');if(br&&!br.value)br.value='RBC statement '+D.date;const ts=$('#t-stmt');if(ts&&!ts.value)ts.value=E.bal(D,'1210').cad;const tr=$('#t-ref');if(tr&&!tr.value)tr.value='TJ-STMT-'+BCODE+'-'+D.date.replace(/-/g,'');
  document.querySelectorAll('#app input,#app textarea').forEach(el=>{if(el.id&&DRX.test(el.id)&&!el.disabled&&el.value!=='')DRAFT[el.id]=el.value});
  toast({ok:true,msg:'Expected figures copied into the count and statement fields. Change any figure that differs, then save.'});return}
 const a=b.dataset.act;if(!a)return;
 if(a=='record'){const r=act('record',{...FORM,amt:+FORM.amt,rate:+FORM.rate,com:+FORM.com||0});if(r.ok){FORM={...FORM,amt:'',ext:'',override:'',com:'',note:''};render()}return}
 if(a=='count')return act('count',readCounts(),CLEAR.count);
 if(a=='stmt-bank')return act('stmt',{kind:'bank',stmt:val('b-stmt'),sref:val('b-ref'),items:val('b-items')},CLEAR['stmt-bank']);
 if(a=='stmt-taaj')return act('stmt',{kind:'taaj',stmt:val('t-stmt'),sref:val('t-ref')},CLEAR['stmt-taaj']);
 if(a=='reason')return act('reason',{id:b.dataset.id,reason:val('rs-'+b.dataset.id),sref:val('rf-'+b.dataset.id)},['rs-'+b.dataset.id,'rf-'+b.dataset.id]);
 if(a=='raiseAdj')return act('raiseAdj',{id:b.dataset.id});
 if(a=='approveAdj')return act('approveAdj',{ref:b.dataset.ref});
 if(a=='rejectAdj'){const tr=b.closest('td');if(!tr.querySelector('input')){tr.insertAdjacentHTML('beforeend',`<div class="mini"><input id="rj-${b.dataset.ref}" placeholder="Reason for rejecting"><button type="button" class="dg" data-act="rejectAdjGo" data-ref="${b.dataset.ref}">Reject</button></div>`)}return}
 if(a=='rejectAdjGo')return act('approveAdj',{ref:b.dataset.ref,reject:true,reason:val('rj-'+b.dataset.ref)});
 if(a=='rateSet')return act('rateSet',{ccy:b.dataset.ccy,rate:val('rt-'+b.dataset.ccy),src:val('rs-src-'+b.dataset.ccy)},['rt-'+b.dataset.ccy,'rs-src-'+b.dataset.ccy]);
 if(a=='rateAp')return act('rateAp',{ccy:b.dataset.ccy});
 if(a=='returnDay')return act('returnDay',{reason:val('ret-reason')},CLEAR.returnDay);
 if(a=='reverse')return act('reverse',{ref:val('rv-ref'),reason:val('rv-reason')},CLEAR.reverse);
 if(a=='next'){const r=act('next');return r}
 act(a)});
document.addEventListener('input',e=>{const t=e.target;if(t.id&&DRX.test(t.id))DRAFT[t.id]=t.value;if(t.dataset&&t.dataset.f){FORM[t.dataset.f]=t.value;const pv=$('#txpv');if(pv)pv.innerHTML=txPreview()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.f&&t.tagName=='SELECT'){FORM[t.dataset.f]=t.value;if(t.dataset.f=='type'||t.dataset.f=='ccy'){if(FORM.type=='buy'||FORM.type=='sell')FORM.rate=String(BOARD[FORM.ccy][FORM.type=='buy'?'b':'s'])}render()}});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]==h)&&h!=VIEW){VIEW=h;render()}});
{const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]==h))VIEW=h}
boot();
}

</script>
